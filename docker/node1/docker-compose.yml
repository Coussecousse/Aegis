name: aegis-node1

services:
  wazuh:
    image: wazuh/wazuh-manager:4.7.5
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"
      - "55000:55000/tcp"
    volumes:
      - wazuh-data:/var/ossec/data
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
    environment:
      WAZUH_API_USER: ${WAZUH_API_USER}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD}
      WAZUH_AGENT_CPU_CAP_PERCENT: ${WAZUH_AGENT_CPU_CAP_PERCENT:-5}
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:55000/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal

  rabbitmq:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/config/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: aegis
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal

  chromadb:
    image: chromadb/chroma:0.4.24
    restart: unless-stopped
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal

  middleware:
    image: python:3.12-slim
    command: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      CHROMADB_HOST: ${CHROMADB_HOST}
      CHROMADB_PORT: ${CHROMADB_PORT}
      OLLAMA_HOST: ${OLLAMA_HOST}
      SLM_MODEL: ${SLM_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      WAZUH_MANAGER_HOST: ${WAZUH_MANAGER_HOST}
      WAZUH_API_PORT: ${WAZUH_API_PORT}
      WAZUH_API_USER: ${WAZUH_API_USER}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD}
      SHUFFLE_WEBHOOK_URL: ${SHUFFLE_WEBHOOK_URL}
      WAZUH_AGENT_CPU_CAP_PERCENT: ${WAZUH_AGENT_CPU_CAP_PERCENT:-5}
    depends_on:
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - aegis-internal

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:1.2.0
    restart: unless-stopped
    volumes:
      - shuffle-data:/shuffle-data
    environment:
      BACKEND_HOSTNAME: shuffle-backend
      DATASTORE_EMULATOR_HOST: shuffle-database:8000
      SHUFFLE_ENCRYPTION_MODIFIER: ${SHUFFLE_ENCRYPTION_MODIFIER}
      OUTER_HOSTNAME: ${OUTER_HOSTNAME}
    networks:
      - aegis-internal

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:1.2.0
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      BACKEND_HOSTNAME: shuffle-backend
    depends_on:
      - shuffle-backend
    networks:
      - aegis-internal

  shuffle-database:
    image: opensearchproject/opensearch:2.14.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - shuffle-data:/usr/share/opensearch/data
    networks:
      - aegis-internal

  prometheus:
    image: prom/prometheus:v2.45.6
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - aegis-internal
      - aegis-monitoring

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/crisis.json
    depends_on:
      - prometheus
    networks:
      - aegis-internal
      - aegis-monitoring

networks:
  aegis-internal:
    driver: bridge
    internal: true
  aegis-monitoring:
    driver: bridge

volumes:
  wazuh-data:
  wazuh-logs:
  wazuh-queue:
  rabbitmq-data:
  chromadb-data:
  shuffle-data:
  prometheus-data:
  grafana-data:
