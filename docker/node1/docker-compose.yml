name: aegis-node1

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.5
    hostname: wazuh.indexer
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ./wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key:ro
      - ./wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem:ro
      - ./wazuh/certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem:ro
      - ./wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem:ro
      - ./wazuh-indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./wazuh-indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':23F0' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - aegis-internal

  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.5
    hostname: wazuh.manager
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"
      - "55000:55000/tcp"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      - ./wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./wazuh/config/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${WAZUH_API_USER}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
      WAZUH_AGENT_CPU_CAP_PERCENT: ${WAZUH_AGENT_CPU_CAP_PERCENT:-5}
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:55000/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal
      - aegis-monitoring

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.5
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD}
      API_USERNAME: ${WAZUH_API_USER}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    volumes:
      - ./wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh-dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./wazuh-dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':15E1' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - aegis-internal
      - aegis-monitoring

  rabbitmq:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/config/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: aegis
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal

  chromadb:
    image: chromadb/chroma:0.4.24
    restart: unless-stopped
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal

  middleware:
    image: python:3.12-slim
    command: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      CHROMADB_HOST: ${CHROMADB_HOST}
      CHROMADB_PORT: ${CHROMADB_PORT}
      OLLAMA_HOST: ${OLLAMA_HOST}
      SLM_MODEL: ${SLM_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      WAZUH_MANAGER_HOST: ${WAZUH_MANAGER_HOST}
      WAZUH_API_PORT: ${WAZUH_API_PORT}
      WAZUH_API_USER: ${WAZUH_API_USER}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD}
      SHUFFLE_WEBHOOK_URL: ${SHUFFLE_WEBHOOK_URL}
      WAZUH_AGENT_CPU_CAP_PERCENT: ${WAZUH_AGENT_CPU_CAP_PERCENT:-5}
    depends_on:
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - aegis-internal

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:1.2.0
    restart: unless-stopped
    volumes:
      - shuffle-data:/shuffle-data
    environment:
      BACKEND_HOSTNAME: shuffle-backend
      DATASTORE_EMULATOR_HOST: shuffle-database:8000
      SHUFFLE_ENCRYPTION_MODIFIER: ${SHUFFLE_ENCRYPTION_MODIFIER}
      OUTER_HOSTNAME: ${OUTER_HOSTNAME}
    networks:
      - aegis-internal
      - aegis-monitoring

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:1.2.0
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      BACKEND_HOSTNAME: shuffle-backend
    depends_on:
      - shuffle-backend
    networks:
      - aegis-internal
      - aegis-monitoring

  shuffle-database:
    image: opensearchproject/opensearch:2.14.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - shuffle-data:/usr/share/opensearch/data
    networks:
      - aegis-internal

  prometheus:
    image: prom/prometheus:v2.45.6
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - aegis-internal
      - aegis-monitoring

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/crisis.json
    depends_on:
      - prometheus
    networks:
      - aegis-internal
      - aegis-monitoring

networks:
  aegis-internal:
    driver: bridge
    internal: true
  aegis-monitoring:
    driver: bridge

volumes:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  filebeat-etc:
  filebeat-var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  rabbitmq-data:
  chromadb-data:
  shuffle-data:
  prometheus-data:
  grafana-data:
