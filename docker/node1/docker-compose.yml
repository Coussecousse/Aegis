name: aegis-node1

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.5
    hostname: wazuh.indexer
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/certs:/usr/share/wazuh-indexer/certs:ro
      - ./wazuh-indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./wazuh-indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':23F0' /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - aegis-internal

  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.5
    hostname: wazuh.manager
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"
      - "55000:55000/tcp"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      - ./wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${WAZUH_API_USER}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
      WAZUH_AGENT_CPU_CAP_PERCENT: ${WAZUH_AGENT_CPU_CAP_PERCENT:-5}
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:55000/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal
      - aegis-monitoring

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.5
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD}
      API_USERNAME: ${WAZUH_API_USER}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    volumes:
      - ./wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh-dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./wazuh-dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':15E1' /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - aegis-internal
      - aegis-monitoring

  rabbitmq:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/config/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: aegis
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal
      - aegis-monitoring

  rabbitmq-bootstrap:
    image: curlimages/curl:8.12.1
    restart: "no"
    command: ["sh", "/bootstrap/bootstrap-definitions.sh"]
    volumes:
      - ./rabbitmq/config/definitions.json:/bootstrap/definitions.json:ro
      - ./rabbitmq/config/bootstrap-definitions.sh:/bootstrap/bootstrap-definitions.sh:ro
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - aegis-internal

  chromadb:
    image: chromadb/chroma:0.4.24
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aegis-internal
      - aegis-monitoring

  middleware:
    build:
      context: ../..
      dockerfile: docker/node1/middleware/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-aegis}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-aegis.triage}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: ${CHROMADB_PORT:-8000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      SLM_MODEL: ${SLM_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      SLM_TIMEOUT: ${SLM_TIMEOUT:-10}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-45}
      SUSPICION_THRESHOLD: ${SUSPICION_THRESHOLD:-0.5}
      SHUFFLE_WEBHOOK_URL: ${SHUFFLE_WEBHOOK_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LDAP_HOST: ${LDAP_HOST:-}
      LDAP_PORT: ${LDAP_PORT:-0}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-false}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_TIER0_GROUP_DN: ${LDAP_TIER0_GROUP_DN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-bootstrap:
        condition: service_completed_successfully
      chromadb:
        condition: service_healthy
    networks:
      - aegis-internal
      - aegis-monitoring

  collector:
    build:
      context: ../..
      dockerfile: docker/node1/middleware/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "aegis.collectors", "--daemon"]
    volumes:
      - wazuh-logs:/var/ossec/logs:ro
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-aegis}
      WAZUH_ALERTS_FILE: ${WAZUH_ALERTS_FILE:-/var/ossec/logs/alerts/alerts.json}
      WAZUH_MIN_LEVEL: ${WAZUH_MIN_LEVEL:-7}
      WAZUH_POLL_INTERVAL: ${WAZUH_POLL_INTERVAL:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-bootstrap:
        condition: service_completed_successfully
    networks:
      - aegis-internal

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:1.2.0
    profiles: ["full"]
    restart: unless-stopped
    volumes:
      - shuffle-data:/shuffle-data
    environment:
      BACKEND_HOSTNAME: shuffle-backend
      DATASTORE_EMULATOR_HOST: shuffle-database:8000
      OPENSEARCH_URL: http://shuffle-database:9200
      SHUFFLE_OPENSEARCH_SKIPSSL: "true"
      SHUFFLE_ENCRYPTION_MODIFIER: ${SHUFFLE_ENCRYPTION_MODIFIER}
      OUTER_HOSTNAME: ${OUTER_HOSTNAME}
    depends_on:
      - shuffle-database
    networks:
      - aegis-internal
      - aegis-monitoring

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:1.2.0
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      BACKEND_HOSTNAME: shuffle-backend
    depends_on:
      - shuffle-backend
    networks:
      - aegis-internal
      - aegis-monitoring

  shuffle-database:
    image: opensearchproject/opensearch:2.14.0
    profiles: ["full"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - shuffle-data:/usr/share/opensearch/data
    networks:
      aegis-internal:
        aliases:
          - shuffle-opensearch

  prometheus:
    image: prom/prometheus:v2.45.6
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - aegis-internal
      - aegis-monitoring

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/crisis.json
    depends_on:
      - prometheus
    networks:
      - aegis-internal
      - aegis-monitoring

networks:
  aegis-internal:
    driver: bridge
    internal: true
  aegis-monitoring:
    driver: bridge

volumes:
  wazuh-api-configuration:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  filebeat-etc:
  filebeat-var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  rabbitmq-data:
  chromadb-data:
  shuffle-data:
  prometheus-data:
  grafana-data:
