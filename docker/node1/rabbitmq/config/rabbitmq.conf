# Expose per-queue metrics (queue_messages, queue_messages_ready,
# queue_messages_unacknowledged, etc.) on the rabbitmq_prometheus scrape
# endpoint (15692). Without this, the plugin only returns node-aggregated
# metrics and series like rabbitmq_queue_messages{queue="aegis.triage"} do
# not exist — required for the AEGIS Crisis dashboard queue depth panel.
prometheus.return_per_object_metrics = true
