name: aegis-juiceshop

services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    restart: unless-stopped
    networks:
      - juice-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "9080:80"
    volumes:
      - ./juice-shop/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./juice-shop/logs:/var/log/nginx
    depends_on:
      - juice-shop
    networks:
      - juice-net

networks:
  juice-net:
    driver: bridge
