global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: middleware
    static_configs:
      - targets: ['middleware:8080']

  - job_name: raspberrypi
    scrape_interval: 30s
    static_configs:
      - targets: ['10.0.0.1:9100']
        labels:
          instance: raspberry-pi
