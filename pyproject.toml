[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.3.0"
description = "Sovereign on-premise SOC orchestrator for industrial SMEs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "aio-pika>=9.5,<10",
  "chromadb>=0.4.0,<0.5.0",
  "numpy<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "ruff==0.6.9",
  "mypy==1.11.2",
  "pytest==9.0.3",
  "pytest-cov==5.0.0",
  "pytest-asyncio==1.3.0",
  "bandit==1.7.10",
  "pip-audit==2.7.3",
  "pre-commit==3.8.0",
  "detect-secrets==1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
  "critical: mark a test as covering a critical non-negotiable constraint",
]

[tool.coverage.run]
source = ["src/aegis"]
omit = ["tests/*", "**/__init__.py"]

[tool.bandit]
skips = ["B101"]
